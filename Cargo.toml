[package]
name = "vanguard_os"
version = "0.2.0"
edition = "2021"
# Два бинарника — `cargo run` должен запускать оболочку, а не ядро.
default-run = "vanguard_os"

[dependencies]
# Графический движок для высокоскоростного рендеринга окон и Canvas на видеокарте
eframe = "0.28"

# Сбор метрик процессора, оперативной памяти и жестких дисков (вместо psutil)
sysinfo = "0.30"

# Поиск файлов на жестком диске по маске (вместо glob)
glob = "0.3"

# Безопасный расчет хэш-сумм для проверки целостности файлов ядра (вместо hashlib)
md5 = "0.7"

# Локальный генератор случайных чисел для частиц взрыва и глитчей (вместо random)
rand = "0.8"

# Скрытый ввод пароля в терминале без отображения символов (вместо getpass)
rpassword = "7.3"

# Форматирование и вывод живого системного времени и даты (вместо time.strftime)
chrono = "0.4"

# Быстрый многострочный парсинг ИИ-кода с защитой от зависаний (вместо re)
regex = "1.10"

# Инфраструктура сериализации данных (нужна для ureq и VanguardAction)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ФИКС: Ультра-легкий HTTP-клиент ureq v3 с поддержкой нативного TLS для HTTPS-запросов к DeepSeek
ureq = { version = "3.0", features = ["native-tls"] }

# ── Раздельные бинарники: ядро и оболочка ──
# Ядро (движок) и оболочка (egui-рендер) — два процесса. Общие типы и протокол
# IPC — в src/lib.rs, чтобы протокол не разъехался. ИИ-помощник добавится позже.

# Библиотека: общий протокол IPC (src/ipc.rs) + движок (src/core/*) + граница ИИ (src/ai_core.rs)
[lib]
name = "vanguard_os_lib"
path = "src/lib.rs"

# Оболочка: egui-приложение (src/main.rs)
[[bin]]
name = "vanguard_os"
path = "src/main.rs"

# Ядро: TCP-сервер движка без GUI (src/bin/core.rs)
[[bin]]
name = "vanguard_core"
path = "src/bin/core.rs"

# ── Профили сборки ──
# dev остаётся дефолтным: RustRover дебажит, а debug-информация на диске —
# осознанно платимая цена (target/ разрастается до 5+ ГБ; чистит `vg clean`).
#
# release собирается под раздачу. LTO + один codegen-unit + strip дают заметно
# меньший и быстрый exe ценой примерно двукратной сборки (~46 c -> ~90 c).
# panic = "abort" намеренно НЕ ставится: оболочка — GUI, а abort вместо
# unwinding убивает окно без шанса на что-либо.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
